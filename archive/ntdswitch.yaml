substitutions:
  device_name: ntdswitch
  device_name_full: "NTD power controller"

esphome:
  name: ntdswitch

esp8266:
  board: esp01_1m

logger:
  level: INFO
  hardware_uart: UART0_SWAP
  baud_rate: 115200

api:
  encryption:
    key: "rlq+PRMblMlyBZ6cvDZhn/DK2ouxSzocwmcH/v3pKD8="

ota:
  password: "1e6d9db8abe433bbc8ad805e1df6804c"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}"
    password: !secret ap_password

captive_portal:

### Sensors ###

# WiFi signal strength sensor
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

# Platform Status sensor
binary_sensor:
  - platform: status
    name: "${device_name_full} status"

status_led:
  pin: GPIO1

switch:
  - name: "NTD Reset"
    icon: "mdi:web-off"
    platform: gpio
    id: relay
    pin: 
      number: 0
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 3000ms
      - switch.turn_off: relay
