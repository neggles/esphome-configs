substitutions:
  devname: "catsnacks"
  devname_full: "catsnack dispenser"

esphome:
  name: ${devname}
  platformio_options:
    # stops boot loop
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    version: latest

# override with my custom tuya
external_components:
  - source: github://neg2led/esphome-components
    components: [ tuya ]
    refresh: 1h

logger:
  level: VERBOSE
  baud_rate: 0 # serial log disabled for tuya mcu

# Enable Home Assistant API
api:
  encryption:
    key: "cA0KrZsJUwWHNZI627/lLCT5cNytXUrkRQgpA5gNqdo="
ota:
  password: "3d880d0cb6e7bedcac1cbc32b5436b58"

wifi:
  power_save_mode: light
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 1
    - ssid: luna
      password: !secret wifi_password
      priority: 0
  ap:
    ssid: ${devname}
    password: !secret ap_password
#captive_portal: # doesn't work without arduino

# status sensor
binary_sensor:
  - platform: status
    name: "${devname_full} status"

# UART for tuya-mcu
uart:
  rx_pin: GPIO20
  tx_pin: GPIO19
  baud_rate: 9600
  debug:
    direction: BOTH

# time for tuya
time:
  - platform: homeassistant
    id: homeassistant_time

# tuya mcu
tuya:
  id: tuyamcu
  time_id: homeassistant_time
  status_pin:
    number: 3
    
