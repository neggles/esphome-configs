substitutions:
  device_name: solderfan

esphome:
  name: $device_name
  friendly_name: $device_name
  platformio_options: 
    build_flags: "-DI2C_NUM_1=I2C_NUM_0"

external_components:
  - source: github://pr#8283
    components: [ i2c ]

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    version: 5.3.1
    platform_version: 6.9.0    

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "sm4NMac4zFiDkcy74oERNNs5FEWjgpKsg24aWoFC/uM="

ota:
  - platform: esphome
    password: "dbeb686b61e8883e409a28bc759dc93b"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name}"
    password: !secret ap_pass

captive_portal:

# enable debugging
debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s
    entity_category: diagnostic

light:
  - platform: status_led
    id: status_light
    output: status_output

  - platform: esp32_rmt_led_strip
    id: esp_rgb_led
    name: "Status LED"
    icon: "mdi:led-outline"
    rgb_order: GRB
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    entity_category: config
    restore_mode: ALWAYS_OFF

switch:
  - platform: template
    id: status_led_switch
    optimistic: true
    entity_category: config
    on_turn_on:
      - light.turn_on: 
          id: esp_rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
          transition_length: 50ms
    on_turn_off:
      - light.turn_off: 
          id: esp_rgb_led
          transition_length: 50ms

output:
  - platform: template
    id: status_output
    type: binary
    write_action:
      - if:
          condition:
             lambda: return state > 0;
          then:
            - if:
                condition:
                  switch.is_off: status_led_switch
                then:
                  switch.turn_on: status_led_switch
          else:
            - if:
                condition:
                  switch.is_on: status_led_switch
                then:
                  switch.turn_off: status_led_switch