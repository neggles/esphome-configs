defaults:
  status_button_gpio: ${status_button_gpio}
  status_button_inverted: true
  status_rgb_gpio: ${status_rgb_gpio}
  status_rgb_count: 1
  status_rgb_brt_max: 75%
  status_rgb_brt_hi: 100%
  status_rgb_brt_mid: 50%
  status_rgb_brt_lo: 25%

external_components:
  - source: github://neggles/esphome@rgb-status-indicator
    components: [status_indicator]
    refresh: "1h"

# Status LED
light:
  - platform: esp32_rmt_led_strip
    id: status_rgb_led
    name: Status Light
    icon: mdi:led-outline
    entity_category: config
    disabled_by_default: true
    rgb_order: GRB
    pin: ${status_rgb_gpio}
    num_leds: ${status_rgb_count}
    chipset: SK6812
    color_correct:
      - ${status_rgb_brt_max}
      - ${status_rgb_brt_max}
      - ${status_rgb_brt_max}
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 1s
          min_brightness: ${status_rgb_brt_lo}
          max_brightness: ${status_rgb_brt_hi}
      - pulse:
          name: fast_pulse
          transition_length: 200ms
          update_interval: 200ms
          min_brightness: ${status_rgb_brt_lo}
          max_brightness: ${status_rgb_brt_hi}
      - addressable_rainbow:
          name: rainbow
          speed: 10
          width: 1

binary_sensor:
  - platform: gpio
    id: button
    name: Device Button
    icon: mdi:gesture-tap-button
    pin:
      number: ${status_button_gpio}
      inverted: ${status_button_inverted}
    disabled_by_default: true
    on_press:
      - status.push:
          trigger_id: status_purple
    on_release:
      - status.pop:
          trigger_id: status_purple
    on_multi_click:
      - timing:
          # double-click and hold
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at least 5s
          - OFF for at least 0.2s
        then:
          - status.push:
              trigger_id: status_red_pulse
          - logger.log:
              level: WARN
              tag: button
              format: "Enabling WiFi AP mode"
          - delay: 1s
          - lambda: |-
              wifi::global_wifi_component->set_ap_timeout(1);
              wifi::global_wifi_component->disable();
              wifi::global_wifi_component->clear_sta();
              wifi::global_wifi_component->enable();
          - delay: 1s
          - status.pop:
              trigger_id: status_red_pulse

      - timing:
          - ON for at least 10s
          - OFF for at least 0.2s
        then:
          - status.push:
              trigger_id: status_red_flash
          - logger.log:
              level: WARN
              tag: button
              format: "Factory Reset initiated by button"
          - delay: 1s
          - switch.turn_on: factory_reset_switch

status_indicator:
  # half brightness solid green when everything is ok
  on_turn_off:
    trigger_id: status_okay
    then:
      - light.turn_on:
          id: status_rgb_led
          <<: !include colors/green.yaml
          brightness: ${status_rgb_brt_mid}
          effect: none

  # slow orange pulse on warnings
  on_app_warning:
    trigger_id: status_warning
    priority: 1
    then:
      - light.turn_on:
          id: status_rgb_led
          <<: !include colors/orange.yaml
          brightness: ${status_rgb_brt_hi}
          effect: slow_pulse

  # slow red pulse on errors
  on_app_error:
    trigger_id: status_error
    priority: 2
    then:
      - light.turn_on:
          id: status_rgb_led
          <<: !include colors/red.yaml
          brightness: ${status_rgb_brt_hi}
          effect: slow_pulse

  # fast magenta pulse when no network
  on_network_disconnected:
    trigger_id: status_no_network
    priority: 3
    then:
      - light.turn_on:
          id: status_rgb_led
          <<: !include colors/magenta.yaml
          brightness: ${status_rgb_brt_hi}
          effect: fast_pulse

  # slow pale yellow pulse when AP mode is active
  on_wifi_ap_active:
    trigger_id: status_ap_mode
    priority: 4
    then:
      - light.turn_on:
          id: status_rgb_led
          <<: !include colors/yellow.yaml
          brightness: ${status_rgb_brt_hi}
          effect: slow_pulse

  # custom status triggers to be used by other components
  on_custom_status:
    - trigger_id: status_red
      then:
        - light.turn_on: &status_red
            id: status_rgb_led
            <<: !include colors/red.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None
    - trigger_id: status_red_pulse
      then:
        - light.turn_on:
            <<: *status_red
            effect: slow_pulse
    - trigger_id: status_red_flash
      then:
        - light.turn_on:
            <<: *status_red
            effect: fast_pulse

    - trigger_id: status_orange
      then:
        - light.turn_on: &status_orange
            id: status_rgb_led
            <<: !include colors/orange.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None
    - trigger_id: status_orange_pulse
      then:
        - light.turn_on:
            id: status_rgb_led
            <<: *status_orange
            effect: slow_pulse
    - trigger_id: status_orange_flash
      then:
        - light.turn_on:
            id: status_rgb_led
            <<: *status_orange
            effect: fast_pulse

    - trigger_id: status_green
      then:
        - light.turn_on: &status_green
            id: status_rgb_led
            <<: !include colors/green.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None

    - trigger_id: status_blue
      then:
        - light.turn_on:
            id: status_rgb_led
            <<: !include colors/blue.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None

    - trigger_id: status_cyan
      then:
        - light.turn_on: &status_cyan
            id: status_rgb_led
            <<: !include colors/cyan.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None

    - trigger_id: status_yellow
      then:
        - light.turn_on:
            id: status_rgb_led
            <<: !include colors/yellow.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None

    - trigger_id: status_purple
      then:
        - light.turn_on:
            id: status_rgb_led
            <<: !include colors/violet.yaml
            brightness: ${status_rgb_brt_hi}
            effect: None
