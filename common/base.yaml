---
defaults:
  log_level: INFO

# Enable logging
logger:
  level: ${log_level}

# enable OTA
ota:
  - platform: esphome
    password: !secret ota_password

# enable API and home assistant time source
packages:
  - !include api.yaml
  - !include hassio/time.yaml

# Platform Status sensors
sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    id: device_ok
    name: Status
    entity_category: diagnostic

# remote reboot switch
switch:
  - platform: restart
    id: restart_switch
    name: Restart Device
    entity_category: config
    disabled_by_default: true
    restore_mode: ALWAYS_OFF

  - platform: factory_reset
    id: factory_reset_switch
    name: Factory Reset
    entity_category: config
    disabled_by_default: true
    restore_mode: ALWAYS_OFF
