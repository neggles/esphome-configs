---
defaults:
  reboot_timeout: 15min
  ap_timeout: 90s
  update_interval: 60s
  wifi_power_save_mode: LIGHT

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret kg_wifi_ssid
      password: !secret kg_wifi_password
  reboot_timeout: ${reboot_timeout}
  power_save_mode: ${wifi_power_save_mode}
  ap:
    ssid: ${device}-AP
    password: !secret wifi_ap_password
    ap_timeout: ${ap_timeout}

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal dB"
    icon: mdi:wifi
    update_interval: ${update_interval}
    device_class: signal_strength
    unit_of_measurement: dBm
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_signal_5min
    name: WiFi Signal (avg)
    icon: mdi:wifi
    update_interval: ${update_interval}
    device_class: signal_strength
    unit_of_measurement: dBm
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
          send_first_at: 1

# Unicode block characters:
# U+2581 ▁ 0xE2 0x96 0x81 Lower one eighth block
# U+2582 ▂ 0xE2 0x96 0x82 Lower one quarter block
# U+2583 ▃ 0xE2 0x96 0x83 Lower three eighths block
# U+2584 ▄ 0xE2 0x96 0x84 Lower half block
# U+2585 ▅ 0xE2 0x96 0x85 Lower five eighths block
# U+2586 ▆ 0xE2 0x96 0x86 Lower three quarters block
# U+2587 ▇ 0xE2 0x96 0x87 Lower seven eighths block
# U+2588 █ 0xE2 0x96 0x88 Full block


text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      icon: mdi:ip-network
      entity_category: diagnostic
      address_0:
        name: IP Address 0
        icon: mdi:ip-network
        entity_category: diagnostic
        disabled_by_default: true
      address_1:
        name: IP Address 1
        icon: mdi:ip-network
        entity_category: diagnostic
        disabled_by_default: true
      address_2:
        name: IP Address 2
        icon: mdi:ip-network
        entity_category: diagnostic
        disabled_by_default: true
      address_3:
        name: IP Address 3
        icon: mdi:ip-network
        entity_category: diagnostic
        disabled_by_default: true
      address_4:
        name: IP Address 4
        icon: mdi:ip-network
        entity_category: diagnostic
        disabled_by_default: true
    ssid:
      name: Connected SSID
      icon: mdi:access-point-network
      entity_category: diagnostic
    bssid:
      name: Connected BSSID
      icon: mdi:access-point
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: WiFi MAC
      icon: mdi:chip
      entity_category: diagnostic
