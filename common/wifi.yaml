---
defaults:
  reboot_timeout: ${reboot_timeout}
  ap_timeout: 1min
  wifi_power_save_mode: LIGHT

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: ${reboot_timeout}
  power_save_mode: ${wifi_power_save_mode}
  ap:
    ssid: ${device}-AP
    password: !secret wifi_ap_password
    ap_timeout: ${ap_timeout}

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: ${update_interval}
    entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi Signal (avg)
    id: wifi_signal_5min
    update_interval: ${update_interval}
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
          send_first_at: 1

# Unicode block characters:
# U+2581 ▁ 0xE2 0x96 0x81 Lower one eighth block
# U+2582 ▂ 0xE2 0x96 0x82 Lower one quarter block
# U+2583 ▃ 0xE2 0x96 0x83 Lower three eighths block
# U+2584 ▄ 0xE2 0x96 0x84 Lower half block
# U+2585 ▅ 0xE2 0x96 0x85 Lower five eighths block
# U+2586 ▆ 0xE2 0x96 0x86 Lower three quarters block
# U+2587 ▇ 0xE2 0x96 0x87 Lower seven eighths block
# U+2588 █ 0xE2 0x96 0x88 Full block


text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      address_0:
        name: IP Address 0
        disabled_by_default: true
      address_1:
        name: IP Address 1
        disabled_by_default: true
      address_2:
        name: IP Address 2
        disabled_by_default: true
      address_3:
        name: IP Address 3
        disabled_by_default: true
      address_4:
        name: IP Address 4
        disabled_by_default: true
    ssid:
      name: Connected SSID
    bssid:
      name: Connected BSSID
      disabled_by_default: true
    mac_address:
      name: WiFi MAC
