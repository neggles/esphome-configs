# =============================================================================
# reTerminal Sticky — ESPHome Hardware Example
#
# MCU: ESP32-S3R8 (8 MB octal PSRAM, 32 MB flash)
#
# Hardware list:
#   1. 3.97" B/W ePaper 800x480 (SSD1677, SPI)
#   2. 3x buttons (UP=GPIO5, DOWN=GPIO6, OK=GPIO4)
#   3. Buzzer (GPIO48, PWM)
#   4. Battery: BQ27220 fuel gauge + BQ25616 charger
#   5. SHT40 temp & humidity (I2C @0x44)
#   6. PCF8563 RTC (I2C @0x51)
#   7. PDM Microphone (CLK=19, DATA=20, EN=38)
#   8. MicroSD (SPI, EN=10, DET=11, CS=8)
#   9. LSM6DS3TR-C IMU (I2C @0x6A)
#  10. GT911 touch (I2C @0x5D, INT=21, RST=41)
#  11. Deep sleep with GPIO4 ext1 wake-up
#
# Critical: GPIO45 (PWR_HOLD) + GPIO46 (PWR_LOCK) must be HIGH at boot,
# otherwise the device powers off. Handled by the required "power_hold" option.
#
# Serial debug: UART0 via CH343P USB-to-UART bridge.
# =============================================================================

substitutions:
  device: fridge-sticky
  name: "Fridge Sticky"
  area: Kitchen
  update_interval: 60s

  reboot_timeout: 15min
  ap_timeout: 0s # disable automatic AP mode

  log_level: DEBUG

  hassio_domain: !secret hassio_domain
  eink_dashboard_id: 01M0V4T98DHVE21YHWM8BTRHBC

esphome:
  name: ${device}
  friendly_name: ${name}
  area: ${area}
  on_boot:
    priority: 600
    then:
      # Hold power rails on / 保持电源轨开启
      - output.turn_on: pwr_hold
      - output.turn_on: pwr_lock

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

packages:
  base: !include
    file: common/base.yaml
    vars:
      log_level: ${log_level}
  wifi: !include common/wifi.yaml
  web_server: !include common/web_server.yaml

logger:
  hardware_uart: UART0

psram:
  mode: octal
  speed: 80MHz

wifi:
  on_connect:
    then:
      - delay: 5s
      - component.update: dashboard_image

api:
  actions:
    - action: update_dashboard
      variables:
        dashboard_id: string
      then:
        - logger.log:
            format: "Updating ePaper dashboard image for dashboard_id=%s"
            args: [dashboard_id.c_str()]
        - online_image.set_url:
            id: dashboard_image
            url: !lambda |-
              return "https://${hassio_domain}/api/eink_dashboard/" + dashboard_id + "/image.png";
        - component.update: dashboard_image
        - api.respond:
            success: true

# =============================================================================
# Fonts / 字体
# =============================================================================

font:
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 32
  - file: "gfonts://Inter@700"
    id: font_large
    size: 48

# SPI — shared by ePaper display and SD card
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

# I2C sensor bus — SHT4x, PCF8563, BQ27220, LSM6DS3
# GPIO0 is an ESP32-S3 strapping pin; keep this bus passive during boot.
i2c:
  - id: i2c_sensor
    scl:
      number: GPIO0
      ignore_strapping_warning: True
    sda:
      number: GPIO1
    frequency: 400kHz

output:
  # Power latch hold — must be HIGH or the device powers off
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: True

  # Power lock — must be HIGH after boot
  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: True

  # Buzzer PWM output (LEDC)
  - platform: ledc
    id: buzzer_pwm
    pin:
      number: GPIO48
      mode: OUTPUT

  # BQ25616 charger enable (GPIO39, active LOW: LOW = charging enabled)
  - platform: gpio
    id: charge_enable
    pin:
      number: GPIO39
      inverted: true

rtttl:
  - id: buzzer
    output: buzzer_pwm

sensor:
  # SHT40 temperature & humidity (I2C @0x44)
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    update_interval: 60s
    temperature:
      id: temp_sensor
      name: "Temperature"
    humidity:
      id: hum_sensor
      name: "Relative Humidity"

  # BQ27220 state-of-charge (I2C @0x55, register 0x2C)
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8));

  # BQ27220 battery voltage in millivolts (register 0x08)
  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x08;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8));

  # BQ27220 signed charge/discharge current in milliamps (register 0x0C)
  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x0C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      uint16_t raw_value = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(raw_value));

binary_sensor:
  # UP button (GPIO5) — short beep
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_up
    name: "Button UP"
    on_press:
      then:
        - logger.log: "Button UP pressed"
        - rtttl.play: "short:d=4,o=5,b=100:16e7"
        - display.page.show_next: epaper_display
        - component.update: epaper_display

  # DOWN button (GPIO6) — short beep
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    id: button_down
    name: "Button DOWN"
    on_press:
      then:
        - logger.log: "Button DOWN pressed"
        - rtttl.play: "short:d=4,o=5,b=100:16e7"
        - display.page.show_previous: epaper_display
        - component.update: epaper_display

  # OK / Power button (GPIO4) — also deep-sleep wake source
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      allow_other_uses: true
      inverted: true
    id: button_ok
    name: "Button OK"
    on_press:
      then:
        - logger.log: "Button OK pressed"
        - rtttl.play: "short:d=4,o=5,b=100:16e6"
        - display.page.show: page_dashboard
        - component.update: dashboard_image

  # Charging state inferred from BQ27220 current (>20mA means charging)
  - platform: template
    id: charging
    name: "Battery Charging"
    lambda: |-
      if (isnan(id(battery_current).state)) return false;
      return id(battery_current).state > 20.0f;

time:
  # PCF8563 at I2C address 0x51. Read on boot; HA sync writes back.
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51

  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:

# -----------------------------------------------------------------------------
# [4] BQ27220 fuel gauge (I2C @0x55 on i2c_sensor)
# The sensors above read BQ27220 registers directly with ESPHome's I2C bus API.
# -----------------------------------------------------------------------------

# =============================================================================
# [1] ePaper display (3.97" B/W, 800x480, SSD1677, SPI)
# The "seeed-reterminal-sticky" model preset (ESPHome PR #16950) auto-fills
# cs_pin=GPIO15, dc_pin=GPIO16, reset_pin=GPIO17, busy_pin=GPIO18,
# enable_pin=GPIO47, mirror_x, and 10 MHz data rate. Requires ESPHome dev.
# =============================================================================

http_request:
  verify_ssl: False
  timeout: 2s

image:
  - platform: online_image
    id: dashboard_image
    url: "http://172.21.10.200:8123/api/eink_dashboard/${eink_dashboard_id}/image.png"
    type: GRAYSCALE
    format: PNG
    resize: 800x480
    update_interval: never

    on_download_finished:
      - logger.log:
          level: INFO
          format: "Dashboard image download OK, cached=%d"
          args: [cached]
      - component.update: epaper_display

    on_error:
      - logger.log:
          level: ERROR
          format: "Dashboard image download FAILED!"

display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
    rotation: 180
    pages:
      - id: page_dashboard
        lambda: |-
          ESP_LOGD("display", "=== ePaper display refresh ===");
          it.image(0, 0, id(dashboard_image), COLOR_OFF, COLOR_ON);
      - id: page_status
        lambda: |-
          ESP_LOGD("display", "=== ePaper display refresh ===");

          // ---- Title / 标题 ----
          it.printf(400, 15, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "reTerminal Sticky");
          it.line(20, 55, 780, 55, COLOR_OFF);

          // ---- RTC Time / RTC 时间 ----
          auto now = id(rtc_time).now();
          if (now.is_valid()) {
            it.strftime(400, 65, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "%Y-%m-%d  %H:%M", now);
          } else {
            it.printf(400, 65, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "RTC waiting for sync...");
          }

          // ---- Temperature / 温度 ----
          if (id(temp_sensor).has_state()) {
            it.printf(30, 120, id(font_large), COLOR_OFF, "Temp: %.1f C", id(temp_sensor).state);
          } else {
            it.printf(30, 120, id(font_large), COLOR_OFF, "Temp: -- C");
          }

          // ---- Humidity / 湿度 ----
          if (id(hum_sensor).has_state()) {
            it.printf(30, 185, id(font_large), COLOR_OFF, "Hum:  %.1f %%", id(hum_sensor).state);
          } else {
            it.printf(30, 185, id(font_large), COLOR_OFF, "Hum:  -- %%");
          }

          // ---- Battery / 电池 ----
          if (isnan(id(battery_level).state)) {
            it.printf(30, 260, id(font_medium), COLOR_OFF, "Battery: --%%");
          } else {
            it.printf(30, 260, id(font_medium), COLOR_OFF, "Battery: %.0f%%", id(battery_level).state);
          }

          // ---- Button hints / 按键提示 ----
          it.line(20, 370, 780, 370, COLOR_OFF);
          it.printf(30, 380, id(font_small), COLOR_OFF, "UP/DOWN: beep");
          it.printf(30, 405, id(font_small), COLOR_OFF, "OK (GPIO4): wake");

# =============================================================================
# [11] Deep sleep
# Wakes for run_duration, updates sensors & display, then sleeps.
# Press the OK button (GPIO4) to wake manually at any time.
# =============================================================================
deep_sleep:
  id: deep_sleep_1
  run_duration: 1min
  sleep_duration: 4min
  # ESP32-S3 only supports ext1 wakeup (ext0 not available)
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
  on_wake:
    then:
      - logger.log: "Woke from deep sleep"
      - delay: 5s
      - component.update: dashboard_image

safe_mode:
  boot_is_good_after: 20s
  boot_is_good_on_shutdown: True
