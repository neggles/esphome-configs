select:
  - platform: modbus_controller
    modbus_controller_id: ${solis_modbus_con_id}
    name: Working Mode
    disabled_by_default: true
    address: 3040 # = 3041 - 1
    value_type: U_WORD
    entity_category: config
    icon: mdi:cog-outline
    skip_updates: ${n_skip_infrequent}
    optionsmap:
      "No response": 0
      "Volt-Watt": 1
      "Volt-VAr": 2
      "Fixed power factor": 3
      "Fixed VAr": 4
      "Power-PF": 5
      "Rule 21 Volt-Watt": 6
    web_server:
      sorting_group_id: sort_group_solis_settings
      sorting_weight: 10
    on_value:
      then:
        - logger.log:
            format: "Attempted to set working mode to 0x%04x"
            args: [x]
            level: INFO

binary_sensor:
  - platform: modbus_controller
    name: Normal
    id: solis_${solis_modbus_addr}_operational
    modbus_controller_id: ${solis_modbus_con_id}
    register_type: read
    address: 3071 # = 3072 - 1
    bitmask: 0x0001
    device_class: running
    web_server:
      sorting_group_id: sort_group_solis_state
      sorting_weight: 5

  - platform: modbus_controller
    name: Initializing
    id: solis_${solis_modbus_addr}_initializing
    modbus_controller_id: ${solis_modbus_con_id}
    register_type: read
    address: 3071 # = 3072 - 1
    bitmask: 0x0002
    device_class: problem
    web_server:
      sorting_group_id: sort_group_solis_state
      sorting_weight: 10

  - platform: modbus_controller
