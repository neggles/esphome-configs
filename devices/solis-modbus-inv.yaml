defaults:
  solis_modbus_bus: modbus_bus
  solis_modbus_addr: 1
  solis_time_source: network_time
  solis_update_interval: 30s
  n_skip_infrequent: 9 # 5 minutes if solis_update_interval is 30s

  solis_modbus_con_id: modbus_con_solis

modbus_controller:
  - id: ${solis_modbus_con_id}
    address: ${solis_modbus_addr}
    modbus_id: ${solis_modbus_bus}
    setup_priority: -10
    update_interval: ${solis_update_interval}
    command_throttle: 300ms
    max_cmd_retries: 2

web_server:
  sorting_groups:
    - id: sort_group_solis_data
      name: Inverter Data
      sorting_weight: -20
    - id: sort_group_solis_state
      name: Inverter Status
      sorting_weight: -10
    - id: sort_group_solis_info
      name: Inverter Info
      sorting_weight: 10
    - id: sort_group_solis_settings
      name: Inverter Settings
      sorting_weight: 20

