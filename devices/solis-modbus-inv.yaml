    modbus_controller_id: ${solis_modbus_con_id}
    name: AC output power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    register_type: read
    address: 3004 # = 3005 - 1
    value_type: U_DWORD
    web_server:
      sorting_group_id: sort_group_solis_data
      sorting_weight: 0

  - platform: modbus_controller
    modbus_controller_id: ${solis_modbus_con_id}
    name: DC output power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    register_type: read
    address: 3006 # = 3007 - 1
    value_type: U_DWORD
    web_server:
      sorting_group_id: sort_group_solis_data
      sorting_weight: 1

  - platform: modbus_controller
    modbus_controller_id: ${solis_modbus_con_id}
    name: Total energy
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: kWh
    register_type: read
    address: 3008 # = 3009 - 1
    value_type: U_DWORD
    force_new_range: true # workaround to seperate reg 3006: "skip_updates applies for all components in the same range"
    skip_updates: ${n_skip_infrequent}
    web_server:
      sorting_group_id: sort_group_solis_data
      sorting_weight: 100

  - platform: modbus_controller
    modbus_controller_id: ${solis_modbus_con_id}
    name: Energy this month
